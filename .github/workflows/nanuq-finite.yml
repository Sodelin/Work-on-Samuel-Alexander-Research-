name: NANUQ finite certificates

on:
  push:
    branches: [main]
    paths:
      - 'research/nanuq-all-level-2026-09-29/**'
      - '.github/workflows/nanuq-finite.yml'
  workflow_dispatch:

jobs:
  exact-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable sources and replay portable exact checks
        run: python3 -B research/nanuq-all-level-2026-09-29/verify_publication.py --recompute
